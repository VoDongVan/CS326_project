<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./script.js" defer></script>
    <script src="//cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <title>FRONT-END</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>

    <div id="login-view" class="view">
        <div class="login-card">
            <div class="login-brand">
                <h1>QuizQZone</h1>
                <p>Enter your username to continue</p>
            </div>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="your-username">
            <button type="button" id="login-button">Log In</button>
        </div>
    </div>
    
    <div id="homepage-view" class="view" style="display: none;">
        <div class="homepage-header">
            <h1>QuizQZone</h1>
        </div>
        <div class="homepage-body">
            <div class="sidebar">
                <button type="button" id="statistic-button" class="sidebar-btn">Statistics</button>
                <button type="button" id="settings-btn" class="sidebar-btn">Settings</button>
                <button id="join-button" type="button" class="sidebar-btn">Join Course</button>
                <button id="logout-button" type="button" class="sidebar-btn">Logout</button>
                <button type="button" id="delete-data" class="sidebar-btn">Delete Data</button>
            </div>
            <div id="course-container"></div>
        </div>
    </div>

    <div id="datelist-view" class="view" style="display: none">
        <h1>Date List</h1>
    </div>

    <div id="quizlist-view" class="view" style="display: none;">
        <h1>Quiz List</h1>
        
    </div>

    <div id="quiz-view" class="view" style="display: none;">
        
    </div>

    <div id="create-quiz-view" class="view" style="display: none;">
        <label for="question">Question:</label>
        <input type="text" id="question" required>
        <label for="num-options">How many options for this question?</label>
        <input type="number" id="num-options" value="4" min="1" max="20">
        <div id="option-input-container"></div>
    </div>

    <div id="create-course-view" class="view" style="display: none;">
        <label for="course-name">Course's Name:</label>
        <input type="text" id="course-name" required>
        <span class="error-msg" id="create-error"></span>
        <div id="qr-display" style="display: none; flex-direction: column; align-items: center; margin-top: 16px;">
            <p><strong>Share this QR code with participants:</strong></p>
            <canvas id="qr-canvas"></canvas>
            <p id="qr-url" style="font-size: 0.85em; word-break: break-all; margin-top: 8px;"></p>
        </div>
    </div>

    <div id="join-course-view" class="view" style="display: none;">
        <label for="course-id">Course's ID</label>
        <input type="text" id="course-id" required>
        <span class="error-msg" id="join-error"></span>
    </div>
    
    <div id="settings-view" class="view" style="display: none;">
        <h2>Settings</h2>
        <p>Logged in as: <strong id="settings-username"></strong></p>
        <div>
            <input type="checkbox" id="dark-mode-toggle">
            <label for="dark-mode-toggle">Dark Mode</label>
        </div>
        <button id="settings-back-btn">Back to Home</button>
    </div>

    <div id="statistic-view" style="display: none;">
        <div id="statistic-container">
            <h1>Your Statistics</h1>
            <div class="circle-wrapper">
                <svg class="progress-circle" width="700" height="500">
                    <circle class="bg-circle" cx="350" cy="250" r="200"></circle>
                    <circle class="fg-circle" cx="350" cy="250" r="200"></circle>
                    <text x="50%" y="50%" id="percent1" text-anchor="middle" dominant-baseline="middle" class="percentage">0%</text>
                </svg>
            </div>
            <p id="correct-answers">0/0 Correct Answers</p>
        </div>
    </div>
     
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
